<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测评</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236C5CE7'/%3E%3Ctext x='32' y='42' font-size='28' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --primary: #6C5CE7;
    --primary-light: #DCD9FB;
    --bg: #F5F6FA;
    --card: #FFFFFF;
    --text: #2D3436;
    --text-light: #8A8F9C;
    --border: #E6E8F0;
    --danger: #E74C3C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 16px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  footer {
    text-align: center;
    padding: 14px 16px 18px;
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.6;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 4px 24px rgba(45, 52, 54, 0.06);
  }

  /* ===== 封面 ===== */
  .cover { text-align: center; margin-top: 6vh; }
  .cover .logo {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, #6C5CE7, #A29BFE);
    color: #fff;
    font-size: 26px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    letter-spacing: 1px;
  }
  .cover h1 { font-size: 27px; font-weight: 700; letter-spacing: 1px; }
  .cover .sub { margin-top: 10px; color: var(--text-light); font-size: 14px; line-height: 1.8; }
  .cover .tags { display: flex; justify-content: center; gap: 8px; margin: 22px 0 30px; flex-wrap: wrap; }
  .cover .tag {
    font-size: 12px; color: var(--primary);
    background: var(--primary-light);
    padding: 5px 12px; border-radius: 999px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 15px 0;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    font-family: inherit;
  }
  .btn:hover { opacity: .9; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .link-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 13px 0;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    font-family: inherit;
  }
  .link-btn:hover { border-color: var(--primary); color: var(--primary); }
  .link-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  /* ===== 答题 ===== */
  .progress-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
    font-size: 13px; color: var(--text-light);
  }
  .progress-bar {
    height: 6px; border-radius: 3px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 26px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 3px;
    transition: width .25s ease;
  }
  .question { font-size: 20px; font-weight: 600; line-height: 1.65; margin-bottom: 26px; min-height: 66px; }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    padding: 18px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #FBFBFE;
    font-size: 15.5px;
    line-height: 1.6;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
    font-family: inherit;
    color: var(--text);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .option .radio {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #C3C7D4;
    flex-shrink: 0;
    margin-top: 1px;
    transition: border-color .15s, box-shadow .15s;
    position: relative;
  }
  .option .radio::after {
    content: '';
    position: absolute;
    left: 3px; top: 3px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    transform: scale(0);
    transition: transform .15s;
  }
  .option:hover { border-color: var(--primary); }
  .option:hover .radio { border-color: var(--primary); }
  .option.picked {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .option.picked .radio { border-color: #fff; }
  .option.picked .radio::after { transform: scale(1); background: #fff; }

  .nav-row { display: flex; gap: 12px; margin-top: 26px; }
  .nav-btn {
    flex: 1;
    padding: 14px 0;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity .15s;
  }
  .nav-prev {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .nav-prev:hover { border-color: var(--primary); color: var(--primary); }
  .nav-next {
    background: var(--primary);
    border: 1.5px solid var(--primary);
    color: #fff;
  }
  .nav-next:hover { opacity: .9; }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
  .restart-link {
    display: block;
    margin: 18px auto 0;
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
  }
  .restart-link.confirming { color: var(--danger); font-weight: 600; }

  /* ===== 结果 ===== */
  .result { text-align: center; }
  .result .label { font-size: 13px; color: var(--text-light); letter-spacing: 3px; }
  .result .type {
    font-size: 56px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: 6px;
    margin: 8px 0 4px;
    animation: pop .45s ease;
  }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.8); }
    60% { transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  .result .hint { font-size: 13px; color: var(--text-light); margin-bottom: 24px; }

  .letters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    text-align: left;
    margin-bottom: 24px;
  }
  .letter-card {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 14px 12px;
    background: #FBFBFE;
  }
  .letter-card .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .letter-card .big {
    font-size: 26px; font-weight: 800; color: var(--primary);
  }
  .letter-card .zh { font-size: 14px; font-weight: 600; }
  .letter-card .en { font-size: 11px; color: var(--text-light); }
  .letter-card .desc { font-size: 12.5px; color: var(--text-light); line-height: 1.65; }

  .dims { display: flex; flex-direction: column; gap: 16px; text-align: left; margin-bottom: 22px; }
  .dim-row { display: flex; align-items: center; gap: 10px; }
  .dim-letter {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    flex-shrink: 0;
  }
  .dim-letter.on { background: var(--primary); color: #fff; }
  .dim-letter.off { background: var(--border); color: var(--text-light); }
  .dim-track {
    flex: 1;
    height: 12px;
    border-radius: 6px;
    background: var(--border);
    overflow: hidden;
    display: flex;
  }
  .dim-seg-a { background: var(--primary); transition: width .6s ease; }
  .dim-seg-b { background: #C8CBE0; flex: 1; }
  .dim-pct { width: 42px; text-align: right; font-size: 12.5px; color: var(--text-light); flex-shrink: 0; font-variant-numeric: tabular-nums; }

  .notice {
    font-size: 12.5px;
    color: #8A6D1A;
    background: #FFF8E1;
    border: 1px solid #F2E3AE;
    border-radius: 10px;
    padding: 12px 14px;
    line-height: 1.7;
    margin-bottom: 20px;
    text-align: left;
  }
  .notice strong { font-weight: 700; }

  /* ===== 历史 ===== */
  .history h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .history .count { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
  .history-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
  .h-item {
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    background: #FBFBFE;
  }
  .h-item .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .h-item .h-type { font-size: 18px; font-weight: 800; color: var(--primary); letter-spacing: 2px; }
  .h-item .h-time { font-size: 12px; color: var(--text-light); }
  .h-item .h-dims { font-size: 12px; color: var(--text-light); line-height: 1.7; }
  .empty {
    text-align: center;
    padding: 40px 0 30px;
    color: var(--text-light);
    font-size: 14px;
  }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }

  @media (max-width: 480px) {
    .container { padding: 20px 14px 16px; }
    .card { padding: 26px 18px; }
    .question { font-size: 18px; }
    .result .type { font-size: 46px; }
    .letters { grid-template-columns: 1fr; gap: 10px; }
    .letter-card { padding: 12px 12px 10px; display: flex; gap: 12px; align-items: center; }
    .letter-card .head { margin-bottom: 0; flex-direction: column; gap: 0; align-items: flex-start; }
    .letter-card .body { flex: 1; }
    .letter-card .desc { margin-top: 4px; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>
<footer>MBTI 性格测评 · 本测评为趣味测试，仅供娱乐和自我了解，不构成心理诊断或专业建议。</footer>

<script>
(function () {
  'use strict';

  /* ===== 题库：四维度各 5 题，交错排列；s: 0 = 第一字母(E/S/T/J)，1 = 第二字母(I/N/F/P) ===== */
  var QUESTIONS = [
    { dim: 'EI', q: '周五晚上的聚会结束了，你更像是哪种状态？',
      opts: [ { t: '精神倍儿棒，还想去下一场', s: 0 }, { t: '终于能回家了，独处让我满血复活', s: 1 } ] },
    { dim: 'SN', q: '学习一样新东西，你更喜欢从哪儿开始？',
      opts: [ { t: '从具体步骤和实例一步步来', s: 0 }, { t: '先弄懂整体概念和大框架', s: 1 } ] },
    { dim: 'TF', q: '朋友向你吐槽工作上的糟心事，你的第一反应是？',
      opts: [ { t: '先共情安慰：这也太惨了吧', s: 1 }, { t: '直接帮他分析问题出在哪', s: 0 } ] },
    { dim: 'JP', q: '出门旅行之前，你通常会？',
      opts: [ { t: '提前做好攻略、订好行程', s: 0 }, { t: '走到哪玩到哪，随遇而安', s: 1 } ] },
    { dim: 'EI', q: '在一个陌生人很多的场合，你通常？',
      opts: [ { t: '主动搭话，很快就能聊起来', s: 0 }, { t: '等别人先开口，或者安静待着', s: 1 } ] },
    { dim: 'SN', q: '听朋友讲一件事，你更容易注意到？',
      opts: [ { t: '具体细节：谁、在哪、说了什么', s: 0 }, { t: '言外之意和整体的感觉', s: 1 } ] },
    { dim: 'TF', q: '做重要决定时，你更看重？',
      opts: [ { t: '逻辑和利弊是否站得住脚', s: 0 }, { t: '自己和相关的人的感受', s: 1 } ] },
    { dim: 'JP', q: '你的待办事项一般放在哪？',
      opts: [ { t: '装在脑子里，大概齐就行', s: 1 }, { t: '写在清单里，做完打勾才踏实', s: 0 } ] },
    { dim: 'EI', q: '遇到烦心事，你更愿意？',
      opts: [ { t: '自己待着，慢慢消化', s: 1 }, { t: '找人聊一聊，说着说着就通了', s: 0 } ] },
    { dim: 'SN', q: '下面哪种描述更符合你？',
      opts: [ { t: '更相信亲身经验和眼见为实', s: 0 }, { t: '常常凭灵感和直觉做判断', s: 1 } ] },
    { dim: 'TF', q: '看别人争论时，你更容易被哪一方说服？',
      opts: [ { t: '论证严密、逻辑扎实的', s: 0 }, { t: '真诚动人、有情感力量的', s: 1 } ] },
    { dim: 'JP', q: '面对截止日期，你倾向于？',
      opts: [ { t: '尽早搞定，落袋为安', s: 0 }, { t: 'deadline 前灵感才爆发', s: 1 } ] },
    { dim: 'EI', q: '团队讨论的时候，你常常？',
      opts: [ { t: '想到就说，边说边理清思路', s: 0 }, { t: '先在心里想清楚再开口', s: 1 } ] },
    { dim: 'SN', q: '想象你的理想假期，更接近？',
      opts: [ { t: '行程清楚、安排妥当，心里有底', s: 0 }, { t: '不设限，跟着心情走', s: 1 } ] },
    { dim: 'TF', q: '如果被人评价"太较真"或"太感性"，你更可能？',
      opts: [ { t: '较真？我只是就事论事', s: 0 }, { t: '你不懂，我是真的在意', s: 1 } ] },
    { dim: 'JP', q: '原定计划突然被打乱，你的第一感受是？',
      opts: [ { t: '无所谓，随机应变也挺好', s: 1 }, { t: '有点烦躁，想尽快恢复秩序', s: 0 } ] },
    { dim: 'EI', q: '难得的空闲周末，你更愿意？',
      opts: [ { t: '在家安静独处，做自己的事', s: 1 }, { t: '约上朋友出去玩，越热闹越好', s: 0 } ] },
    { dim: 'SN', q: '读小说或看电影时，你更偏爱？',
      opts: [ { t: '天马行空的想象和隐喻', s: 1 }, { t: '贴近现实、细节扎实的情节', s: 0 } ] },
    { dim: 'TF', q: '给遇到困难的朋友提建议时，你通常会？',
      opts: [ { t: '先顾及对方心情，再找时机开口', s: 1 }, { t: '直接给出分析和解决方案', s: 0 } ] },
    { dim: 'JP', q: '你的桌面和房间通常是？',
      opts: [ { t: '乱中有序，东西自己能找到', s: 1 }, { t: '分类摆放、整整齐齐才舒服', s: 0 } ] }
  ];

  /* 每题第一字母选项的下标（用于校验与测试） */
  var DIMS = {
    EI: { a: 'E', b: 'I' },
    SN: { a: 'S', b: 'N' },
    TF: { a: 'T', b: 'F' },
    JP: { a: 'J', b: 'P' }
  };
  var DIM_ORDER = ['EI', 'SN', 'TF', 'JP'];
  var PER_DIM = 5;

  var LETTER_INFO = {
    E: { zh: '外向', en: 'Extraversion', desc: '能量来自外部世界，在热闹与交往中充电，喜欢边聊边想。' },
    I: { zh: '内向', en: 'Introversion', desc: '能量来自内心世界，独处时充电，喜欢深度的思考和交流。' },
    S: { zh: '实感', en: 'Sensing', desc: '关注具体事实与细节，相信经验和眼见为实，脚踏实地。' },
    N: { zh: '直觉', en: 'iNtuition', desc: '关注可能性与整体图景，喜欢想象和创新，常有灵光一闪。' },
    T: { zh: '思考', en: 'Thinking', desc: '做决定时以逻辑和利弊为依据，重视客观与公平。' },
    F: { zh: '情感', en: 'Feeling', desc: '做决定时以感受和价值观为依据，重视人际和谐与共情。' },
    J: { zh: '判断', en: 'Judging', desc: '喜欢计划与秩序，事情早早定下来才安心。' },
    P: { zh: '知觉', en: 'Perceiving', desc: '喜欢灵活与开放，留点余地随缘，享受即兴的变化。' }
  };

  var STORE_KEY = 'mbtiHistory20';
  var HISTORY_LIMIT = 20;

  var app = document.getElementById('app');
  var state = 'cover';       // cover | quiz | result | history
  var idx = 0;
  var answers = null;        // Array(20)：null | 0 | 1（选项下标）
  var lastResult = null;     // {type, EI, SN, TF, JP}
  var confirmClear = false;  // 历史页清空确认
  var confirmRestart = false;// 答题页重测确认

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ===== 历史存取 ===== */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveHistory(arr) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(arr)); } catch (e) {}
  }

  /* ===== 渲染 ===== */
  function render() {
    if (state === 'cover') renderCover();
    else if (state === 'quiz') renderQuiz();
    else if (state === 'result') renderResult();
    else if (state === 'history') renderHistory();
  }

  function renderCover() {
    var hasHistory = loadHistory().length > 0;
    app.innerHTML =
      '<div class="card cover">' +
        '<div class="logo">MBTI</div>' +
        '<h1>MBTI 性格测评</h1>' +
        '<p class="sub">20 道生活化单选题，覆盖四个性格维度<br>测出你的四字母人格类型</p>' +
        '<div class="tags">' +
          '<span class="tag">20 题</span>' +
          '<span class="tag">约 3 分钟</span>' +
          '<span class="tag">免注册</span>' +
          '<span class="tag">数据仅存本地</span>' +
        '</div>' +
        '<button class="btn" id="btn-start">开始测试</button>' +
        (hasHistory ? '<button class="link-btn" id="btn-history">查看历史记录</button>' : '') +
      '</div>';
    document.getElementById('btn-start').onclick = startQuiz;
    var h = document.getElementById('btn-history');
    if (h) h.onclick = function () { state = 'history'; confirmClear = false; render(); };
    window.scrollTo(0, 0);
  }

  function startQuiz() {
    state = 'quiz';
    idx = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    lastResult = null;
    confirmRestart = false;
    render();
  }

  function renderQuiz() {
    var q = QUESTIONS[idx];
    var answered = answers.filter(function (a) { return a !== null; }).length;
    var pct = Math.round(answered / QUESTIONS.length * 100);
    var isLast = idx === QUESTIONS.length - 1;
    var curAnswered = answers[idx] !== null;
    var restartHtml = confirmRestart
      ? '<button class="restart-link confirming" id="btn-restart-yes">再点一次确认重新测试</button>'
      : '<button class="restart-link" id="btn-restart">重新测试</button>';
    app.innerHTML =
      '<div class="card">' +
        '<div class="progress-row"><span>第 ' + (idx + 1) + ' / ' + QUESTIONS.length + ' 题</span><span>已答 ' + answered + ' 题 · ' + pct + '%</span></div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="question">' + esc(q.q) + '</div>' +
        '<div class="options">' +
          q.opts.map(function (o, i) {
            return '<button class="option' + (answers[idx] === i ? ' picked' : '') + '" data-i="' + i + '" aria-pressed="' + (answers[idx] === i) + '">' +
              '<span class="radio"></span><span>' + esc(o.t) + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
        '<div class="nav-row">' +
          '<button class="nav-btn nav-prev" id="btn-prev"' + (idx === 0 ? ' disabled' : '') + '>上一题</button>' +
          '<button class="nav-btn nav-next" id="btn-next"' + (curAnswered ? '' : ' disabled') + '>' + (isLast ? '查看结果' : '下一题') + '</button>' +
        '</div>' +
        restartHtml +
      '</div>';
    var btns = app.querySelectorAll('.option');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = (function (bi) { return function () { pick(bi); }; })(i);
    }
    document.getElementById('btn-prev').onclick = function () {
      if (idx > 0) { idx--; confirmRestart = false; render(); }
    };
    document.getElementById('btn-next').onclick = function () {
      if (answers[idx] === null) return;   // 未答不允许前进
      if (idx === QUESTIONS.length - 1) { finish(); }
      else { idx++; confirmRestart = false; render(); }
    };
    var r = document.getElementById('btn-restart');
    if (r) r.onclick = function () { confirmRestart = true; render(); };
    var ry = document.getElementById('btn-restart-yes');
    if (ry) ry.onclick = function () { startQuiz(); };
  }

  function pick(bi) {
    if (state !== 'quiz') return;
    answers[idx] = bi;
    render();   // 重渲染：更新选中态与"下一题"可用性
  }

  function finish() {
    var type = '', dims = {};
    for (var i = 0; i < DIM_ORDER.length; i++) {
      var d = DIM_ORDER[i], meta = DIMS[d];
      var v = 0;
      for (var j = 0; j < QUESTIONS.length; j++) {
        if (QUESTIONS[j].dim === d && QUESTIONS[j].opts[answers[j]].s === 0) v++;
      }
      var pctA = Math.round(v / PER_DIM * 100);
      type += v >= 3 ? meta.a : meta.b;   // 5 题中至少 3 票才算第一字母
      dims[d] = pctA;
    }
    lastResult = { type: type, EI: dims.EI, SN: dims.SN, TF: dims.TF, JP: dims.JP };
    var arr = loadHistory();
    arr.unshift({ ts: Date.now(), type: type, EI: dims.EI, SN: dims.SN, TF: dims.TF, JP: dims.JP });
    if (arr.length > HISTORY_LIMIT) arr = arr.slice(0, HISTORY_LIMIT);
    saveHistory(arr);
    state = 'result';
    render();
  }

  function renderResult() {
    var r = lastResult;
    var rows = DIM_ORDER.map(function (d) {
      var meta = DIMS[d];
      var pctA = r[d];
      var topIsA = pctA >= 50;
      var aCls = topIsA ? 'on' : 'off', bCls = topIsA ? 'off' : 'on';
      return '<div class="dim-row">' +
        '<div class="dim-letter ' + bCls + '">' + meta.b + '</div>' +
        '<div class="dim-track"><div class="dim-seg-a" style="width:' + pctA + '%"></div><div class="dim-seg-b"></div></div>' +
        '<div class="dim-pct">' + (100 - pctA) + '%</div>' +
        '<div class="dim-letter ' + aCls + '">' + meta.a + '</div>' +
        '<div class="dim-pct">' + pctA + '%</div>' +
      '</div>';
    }).join('');
    // 四个字母卡片（按 E/I、S/N、T/F、J/P 中命中者展示）
    var lettersHtml = '';
    for (var i = 0; i < r.type.length; i++) {
      var L = r.type[i], info = LETTER_INFO[L];
      lettersHtml += '<div class="letter-card">' +
        '<div class="head"><span class="big">' + L + '</span><span class="zh">' + info.zh + '</span><span class="en">' + info.en + '</span></div>' +
        '<div class="body"><div class="desc">' + esc(info.desc) + '</div></div>' +
      '</div>';
    }
    app.innerHTML =
      '<div class="card result">' +
        '<div class="label">YOUR TYPE</div>' +
        '<div class="type">' + r.type + '</div>' +
        '<div class="hint">你的四字母人格类型</div>' +
        '<div class="letters">' + lettersHtml + '</div>' +
        '<div class="dims">' + rows + '</div>' +
        '<div class="notice"><strong>本测评仅供娱乐和自我了解，不构成心理诊断或专业建议。</strong>若需专业心理评估，请咨询相关专业人士。</div>' +
        '<button class="btn" id="btn-retest">重新测试</button>' +
        '<button class="link-btn" id="btn-to-history">查看历史记录</button>' +
      '</div>';
    document.getElementById('btn-retest').onclick = startQuiz;
    document.getElementById('btn-to-history').onclick = function () { state = 'history'; confirmClear = false; render(); };
    window.scrollTo(0, 0);
  }

  function fmtTime(ts) {
    var dt = new Date(ts);
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate()) + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes());
  }

  function renderHistory() {
    var arr = loadHistory();
    var listHtml;
    if (arr.length === 0) {
      listHtml = '<div class="empty"><div class="icon">🗒️</div>还没有测试记录<br>完成一次测试后，结果会保存在这里</div>';
    } else {
      listHtml = '<div class="history-list">' + arr.map(function (it) {
        return '<div class="h-item">' +
          '<div class="row1"><span class="h-type">' + esc(it.type) + '</span><span class="h-time">' + fmtTime(it.ts) + '</span></div>' +
          '<div class="h-dims">E ' + it.EI + '% / I ' + (100 - it.EI) + '% · S ' + it.SN + '% / N ' + (100 - it.SN) + '% · T ' + it.TF + '% / F ' + (100 - it.TF) + '% · J ' + it.JP + '% / P ' + (100 - it.JP) + '%</div>' +
        '</div>';
      }).join('') + '</div>';
    }
    app.innerHTML =
      '<div class="card history">' +
        '<h2>历史记录</h2>' +
        '<div class="count">最近 ' + arr.length + ' 条（上限 ' + HISTORY_LIMIT + ' 条，仅保存在本机浏览器）</div>' +
        listHtml +
        (arr.length > 0
          ? (confirmClear
              ? '<button class="btn" id="btn-clear-yes" style="background:#E74C3C">确认清空全部记录？</button><button class="link-btn" id="btn-clear-no">取消</button>'
              : '<button class="link-btn danger" id="btn-clear">清空历史记录</button>')
          : '') +
        '<button class="link-btn" id="btn-back">返回</button>' +
      '</div>';
    var el;
    el = document.getElementById('btn-clear');
    if (el) el.onclick = function () { confirmClear = true; render(); };
    el = document.getElementById('btn-clear-yes');
    if (el) el.onclick = function () { saveHistory([]); confirmClear = false; render(); };
    el = document.getElementById('btn-clear-no');
    if (el) el.onclick = function () { confirmClear = false; render(); };
    document.getElementById('btn-back').onclick = function () {
      state = lastResult ? 'result' : 'cover';
      render();
    };
    window.scrollTo(0, 0);
  }

  render();
})();
</script>
</body>
</html>
