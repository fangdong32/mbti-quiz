<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 职场性格测评</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6C5CE7;--primary-light:#A29BFE;--secondary:#00CEC9;
  --bg:#F8F9FF;--card:#fff;--text:#2D3436;--text-light:#636E72;
  --accent:#FFEAA7;--danger:#FF7675;--border:#E8EAF6;--success:#55EFC4;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding:24px 20px}
.screen{display:none;flex-direction:column;min-height:calc(100vh - 48px);animation:fadein .25s ease}
.screen.active{display:flex}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cover */
#cover{justify-content:center;align-items:center;text-align:center;gap:18px}
.cover-icon{font-size:56px;animation:bounce 2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.cover-title{font-size:26px;font-weight:800;color:var(--primary);letter-spacing:1px}
.cover-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cover-tag{background:var(--accent);color:#856404;font-size:12px;padding:4px 14px;border-radius:20px;font-weight:600}
.cover-sub{font-size:14px;color:var(--text-light);line-height:1.7;max-width:320px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;padding:14px 48px;border-radius:30px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(108,92,231,.3);transition:transform .15s}
.btn-primary:active{transform:scale(.95)}
.btn-secondary{background:var(--card);color:var(--primary);border:1.5px solid var(--primary);padding:10px 32px;border-radius:25px;font-size:14px;font-weight:600;cursor:pointer}

/* Quiz */
#quiz{justify-content:flex-start;gap:14px}
.quiz-top{display:flex;justify-content:space-between;align-items:center}
.quiz-back-btn{background:none;border:none;font-size:18px;color:var(--text-light);cursor:pointer;padding:4px 10px;display:flex;align-items:center;gap:4px}
.quiz-progress-text{font-size:13px;color:var(--text-light);font-weight:600}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:3px;transition:width .3s ease}
.quiz-dim{font-size:12px;color:var(--secondary);font-weight:700;letter-spacing:1px;margin-top:6px}
.quiz-question{font-size:19px;font-weight:700;line-height:1.5;color:var(--text);margin-top:4px}
.quiz-options{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.quiz-option{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.5;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:10px}
.quiz-option:active{transform:scale(.97)}
.quiz-option.selected{border-color:var(--primary);background:#F3F0FF}
.quiz-option.selected .opt-letter{background:var(--primary);color:#fff}
.opt-letter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--text-light);font-weight:700;font-size:13px;flex-shrink:0;margin-top:1px}
.quiz-nav{display:flex;gap:10px;margin-top:auto;padding-top:20px}
.btn-prev{background:var(--card);color:var(--text-light);border:1.5px solid var(--border);padding:12px 24px;border-radius:25px;font-size:15px;font-weight:600;cursor:pointer;flex:1}
.btn-next{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;padding:12px 24px;border-radius:25px;font-size:15px;font-weight:700;cursor:pointer;flex:2;transition:transform .15s}
.btn-next:active{transform:scale(.97)}
.btn-next:disabled{opacity:.4;cursor:not-allowed}

/* Result */
#result{justify-content:flex-start;gap:14px}
.result-card{background:var(--card);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 8px 30px rgba(108,92,231,.1);margin-top:12px}
.result-emoji{font-size:52px;margin-bottom:6px}
.result-type{font-size:34px;font-weight:800;color:var(--primary);letter-spacing:3px}
.result-nick{font-size:17px;font-weight:700;color:var(--text);margin:6px 0}
.result-divider{width:40px;height:3px;background:var(--accent);border-radius:2px;margin:10px auto}
.result-desc{font-size:14px;color:var(--text-light);line-height:1.8;padding:0 6px}
.letter-cards{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.letter-card{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border)}
.letter-badge{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.letter-info{flex:1}
.letter-word{font-size:14px;font-weight:700;color:var(--text)}
.letter-trait{font-size:12px;color:var(--text-light);margin-top:2px;line-height:1.5}
.dim-section{margin-top:16px}
.dim-title{font-size:13px;color:var(--text-light);font-weight:700;margin-bottom:8px}
.dim-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dim-label-left{font-size:12px;font-weight:700;width:60px;text-align:right;flex-shrink:0}
.dim-bar-wrap{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
.dim-bar-inner{height:100%;border-radius:4px;transition:width .6s ease}
.dim-label-right{font-size:12px;font-weight:700;width:60px;flex-shrink:0}
.disclaimer{background:#FEF9E7;border:1px solid #F9E79F;border-radius:10px;padding:12px 14px;margin-top:16px;font-size:12px;color:#7D6608;line-height:1.6;text-align:center}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-bottom:8px}
.btn-retake{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;padding:14px;border-radius:28px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn-retake:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="app">

<!-- Cover -->
<div class="screen active" id="cover">
  <div class="cover-icon">🧩</div>
  <div class="cover-title">MBTI 职场性格测评</div>
  <div class="cover-tags">
    <span class="cover-tag">20题</span>
    <span class="cover-tag">约3分钟</span>
    <span class="cover-tag">趣味版</span>
  </div>
  <div class="cover-sub">20 道趣味职场情景题，测出你的 MBTI 职场性格画像。<br>支持随时回看修改，结果可一目了然。</div>
  <button class="btn-primary" onclick="startQuiz()">开始测评</button>
</div>

<!-- Quiz -->
<div class="screen" id="quiz">
  <div class="quiz-top">
    <button class="quiz-back-btn" onclick="prevQuestion()">‹ 返回</button>
    <span class="quiz-progress-text" id="progressText">1 / 20</span>
    <span style="width:52px"></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>
  <div class="quiz-dim" id="dimLabel">外向 / 内向</div>
  <div class="quiz-question" id="questionText">加载中...</div>
  <div class="quiz-options" id="optionsContainer"></div>
  <div class="quiz-nav">
    <button class="btn-prev" id="prevBtn" onclick="prevQuestion()">上一题</button>
    <button class="btn-next" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
  </div>
</div>

<!-- Result -->
<div class="screen" id="result">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🐶</div>
    <div class="result-type" id="resultType">ENFP</div>
    <div class="result-nick" id="resultNickname">快乐小狗</div>
    <div class="result-divider"></div>
    <div class="result-desc" id="resultDesc">描述加载中...</div>
    <div class="letter-cards" id="letterCards"></div>
    <div class="dim-section" id="dimSection"></div>
    <div class="disclaimer">⚠️ 本测评仅供娱乐和自我了解，不构成心理诊断或专业建议。</div>
  </div>
  <div class="result-actions">
    <button class="btn-retake" onclick="startQuiz()">重新测试</button>
  </div>
</div>

</div>

<script>
// ========== Data ==========
var dimNames = {
  EI: '外向 E / 内向 I',
  SN: '实感 S / 直觉 N',
  TF: '思考 T / 情感 F',
  JP: '判断 J / 知觉 P'
};

var questions = [
  // E/I — 5题
  {dim:'EI', text:'周末到了，你更想怎么过？', a:{text:'约朋友出去聚餐，热闹才开心', val:'E'}, b:{text:'宅家追剧独处，安静才舒服', val:'I'}},
  {dim:'EI', text:'开会时你通常会？', a:{text:'主动发言，想到就说', val:'E'}, b:{text:'先听别人讲，想好再开口', val:'I'}},
  {dim:'EI', text:'参加完一场大型活动，你觉得？', a:{text:'意犹未尽，充满能量', val:'E'}, b:{text:'终于结束了，需要独处充电', val:'I'}},
  {dim:'EI', text:'到了新公司，你倾向于？', a:{text:'尽快认识所有同事', val:'E'}, b:{text:'先和旁边的人混熟就好', val:'I'}},
  {dim:'EI', text:'遇到烦心事，你更倾向于？', a:{text:'找朋友倾诉聊聊就好了', val:'E'}, b:{text:'自己安静消化，不想说', val:'I'}},
  // S/N — 5题
  {dim:'SN', text:'你更愿意相信？', a:{text:'数据和事实，眼见为实', val:'S'}, b:{text:'直觉和灵感，第六感很准', val:'N'}},
  {dim:'SN', text:'接到新项目你先想？', a:{text:'具体怎么落地，一步步拆解', val:'S'}, b:{text:'未来能做成什么样，大胆想象', val:'N'}},
  {dim:'SN', text:'你更喜欢哪种工作？', a:{text:'有明确流程和标准答案的', val:'S'}, b:{text:'可以自由发挥、没有标准答案的', val:'N'}},
  {dim:'SN', text:'向同事介绍一本书你会说？', a:{text:'书里讲了什么具体内容', val:'S'}, b:{text:'这本书给人什么启发', val:'N'}},
  {dim:'SN', text:'做计划时你更关注？', a:{text:'细节是否到位，有没有遗漏', val:'S'}, b:{text:'大方向对不对，整体走向如何', val:'N'}},
  // T/F — 5题
  {dim:'TF', text:'同事犯了错，你会？', a:{text:'直接指出问题，对事不对人', val:'T'}, b:{text:'先考虑他的感受，委婉提醒', val:'F'}},
  {dim:'TF', text:'做决定时你更看重？', a:{text:'逻辑和效率，客观分析', val:'T'}, b:{text:'人情和和谐，大家的感受', val:'F'}},
  {dim:'TF', text:'朋友找你诉苦你会？', a:{text:'帮他分析问题，给解决方案', val:'T'}, b:{text:'先安慰情绪，陪他骂就对了', val:'F'}},
  {dim:'TF', text:'评价一件事你习惯用？', a:{text:'客观标准，对就是对错就是错', val:'T'}, b:{text:'价值观和感受，站在对方角度想', val:'F'}},
  {dim:'TF', text:'团队产生分歧时你倾向于？', a:{text:'用数据和逻辑说服大家', val:'T'}, b:{text:'协调各方需求找共识', val:'F'}},
  // J/P — 5题
  {dim:'JP', text:'面对新任务你倾向于？', a:{text:'提前列好计划，按部就班', val:'J'}, b:{text:'灵活应对，走到哪算哪', val:'P'}},
  {dim:'JP', text:'你的工位桌面通常是？', a:{text:'整整齐齐，物归原位', val:'J'}, b:{text:'看起来乱但我知道东西在哪', val:'P'}},
  {dim:'JP', text:'出差旅行你会？', a:{text:'提前做好攻略和行程表', val:'J'}, b:{text:'到了再说，随机应变', val:'P'}},
  {dim:'JP', text:'对于截止日期你？', a:{text:'提前完成才安心', val:'J'}, b:{text:'最后一刻才有灵感爆发', val:'P'}},
  {dim:'JP', text:'你更喜欢怎样的工作节奏？', a:{text:'有明确节点和里程碑的', val:'J'}, b:{text:'灵活自由、随时调整的', val:'P'}},
];

var dimColors = {
  E:'#E74C3C', I:'#3498DB',
  S:'#F39C12', N:'#9B59B6',
  T:'#2C3E50', F:'#E91E63',
  J:'#16A085', P:'#F1C40F'
};

var dimPairs = {
  EI:{left:'E',right:'I',leftLabel:'外向',rightLabel:'内向',leftColor:'#E74C3C',rightColor:'#3498DB'},
  SN:{left:'S',right:'N',leftLabel:'实感',rightLabel:'直觉',leftColor:'#F39C12',rightColor:'#9B59B6'},
  TF:{left:'T',right:'F',leftLabel:'思考',rightLabel:'情感',leftColor:'#2C3E50',rightColor:'#E91E63'},
  JP:{left:'J',right:'P',leftLabel:'判断',rightLabel:'知觉',leftColor:'#16A085',rightColor:'#F1C40F'}
};

var typeData = {
  INTJ:{emoji:'🦉', nick:'冷面战略家', desc:'别人看到的是你的高冷，其实你的大脑里正在运行三步以后的棋局。社交？能免则免。计划？必须有。'},
  INTP:{emoji:'🤖', nick:'佛系逻辑怪', desc:'你的大脑永远在思考宇宙终极问题，但桌面上的文件永远找不到。对事不对人，逻辑大于一切。'},
  ENTJ:{emoji:'🦁', nick:'霸道总裁', desc:'效率是你的信仰，拖延是你的敌人。你不发火不是脾气好，只是还没到发火的时候。'},
  ENTP:{emoji:'🦊', nick:'辩论赛冠军', desc:'你最喜欢说的话是"但是如果换个角度看..."。点子多到爆炸，执行力嘛...下一个点子！'},
  INFJ:{emoji:'🦌', nick:'温柔预言家', desc:'你能看透每个人的心思，但没人能看透你。表面云淡风轻，内心已经演完一部连续剧。'},
  INFP:{emoji:'🕊', nick:'理想主义诗人', desc:'你对世界充满爱，但也会因为外卖少放了一包酱而陷入存在主义危机。温柔但固执。'},
  ENFJ:{emoji:'☀️', nick:'温暖太阳', desc:'你记得每个人的生日、喜好和心事，是天生的团建委员。但请也关心一下自己好吗？'},
  ENFP:{emoji:'🐶', nick:'快乐小狗', desc:'你的热情可以融化北极冰川，你的灵感多到连自己都追不上。但DDL是你永远的宿敌。'},
  ISTJ:{emoji:'⚓', nick:'定海神针', desc:'你坚信规则就是规则，Excel表格是你的舒适区。靠谱是你的代名词，惊喜不是你的菜。'},
  ISFJ:{emoji:'🛡', nick:'隐形守护者', desc:'你默默记住每个人的咖啡口味，从不邀功但每次都救场。你的座右铭：做好本职工作。'},
  ESTJ:{emoji:'📋', nick:'铁血管理者', desc:'开会你第一个到，任务你第一个交。效率和秩序是你的信仰，摸鱼的人请自重。'},
  ESFJ:{emoji:'🫖', nick:'热心肠大姐', desc:'你总是第一个问"大家午饭吃什么"，团建你组织，年货你采购。有你在就有温度。'},
  ISTP:{emoji:'🔧', nick:'冷面修理工', desc:'话不多但手很巧，什么东西坏了到你手里都能修。表情管理满分，情绪波动为零。'},
  ISFP:{emoji:'🎨', nick:'低调艺术家', desc:'你有自己的审美和节奏，不喜欢被催。给你一个安静的角落和一副耳机，世界就美好了。'},
  ESTP:{emoji:'⚡', nick:'行动派', desc:'先做了再说！你是天生的危机处理专家，越是混乱的局面你越兴奋。计划？那是什么？'},
  ESFP:{emoji:'🎉', nick:'派对制造机', desc:'你的笑声可以穿透三堵墙，有你的地方就有快乐。工作可以无聊但你不行，生活就要有滋有味。'}
};

var letterMeanings = {
  E:{word:'Extraversion 外向', trait:'能量来自外部世界，喜欢社交互动，先行动后思考'},
  I:{word:'Introversion 内向', trait:'能量来自内心世界，偏好独处充电，先思考后行动'},
  S:{word:'Sensing 实感', trait:'关注具体事实和细节，依赖五官感知，重视经验'},
  N:{word:'Intuition 直觉', trait:'关注可能性和大局，依赖灵感联想，重视创新'},
  T:{word:'Thinking 思考', trait:'决策基于逻辑和客观分析，注重公平和效率'},
  F:{word:'Feeling 情感', trait:'决策基于价值观和他人感受，注重和谐与共情'},
  J:{word:'Judging 判断', trait:'偏好有计划有结构的生活，喜欢提前安排和定论'},
  P:{word:'Perceiving 知觉', trait:'偏好灵活开放的生活，喜欢随机应变和探索'}
};

// ========== State ==========
var currentIdx = 0;
var answers = []; // 'A' or 'B' per question, null if unanswered

// ========== Navigation ==========
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startQuiz() {
  currentIdx = 0;
  answers = new Array(20).fill(null);
  renderQuestion();
  showScreen('quiz');
}

// ========== Quiz ==========
function renderQuestion() {
  var q = questions[currentIdx];
  var answered = answers.filter(function(a){return a!==null;}).length;

  document.getElementById('progressText').textContent = (currentIdx + 1) + ' / 20';
  document.getElementById('progressFill').style.width = ((currentIdx + 1) / 20 * 100) + '%';
  document.getElementById('dimLabel').textContent = dimNames[q.dim];
  document.getElementById('questionText').textContent = q.text;

  // Render options
  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  var sel = answers[currentIdx];

  var optA = document.createElement('div');
  optA.className = 'quiz-option' + (sel === 'A' ? ' selected' : '');
  optA.innerHTML = '<span class="opt-letter">A</span><span>' + q.a.text + '</span>';
  optA.onclick = function() { selectOption('A'); };
  container.appendChild(optA);

  var optB = document.createElement('div');
  optB.className = 'quiz-option' + (sel === 'B' ? ' selected' : '');
  optB.innerHTML = '<span class="opt-letter">B</span><span>' + q.b.text + '</span>';
  optB.onclick = function() { selectOption('B'); };
  container.appendChild(optB);

  // Button states
  document.getElementById('prevBtn').disabled = (currentIdx === 0);
  document.getElementById('prevBtn').style.opacity = currentIdx === 0 ? '0.4' : '1';

  var nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = (answers[currentIdx] === null);
  if (currentIdx === 19) {
    nextBtn.textContent = '查看结果';
  } else {
    nextBtn.textContent = '下一题';
  }
}

function selectOption(choice) {
  answers[currentIdx] = choice;
  // Update visual
  var opts = document.getElementById('optionsContainer').children;
  opts[0].className = 'quiz-option' + (choice === 'A' ? ' selected' : '');
  opts[1].className = 'quiz-option' + (choice === 'B' ? ' selected' : '');
  // Enable next button
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (answers[currentIdx] === null) return;
  if (currentIdx < 19) {
    currentIdx++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function prevQuestion() {
  if (currentIdx > 0) {
    currentIdx--;
    renderQuestion();
  } else {
    showScreen('cover');
  }
}

function finishQuiz() {
  // Score
  var scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  for (var i = 0; i < 20; i++) {
    if (!answers[i]) continue;
    var q = questions[i];
    var val = (answers[i] === 'A') ? q.a.val : q.b.val;
    scores[val]++;
  }

  var type = '';
  type += (scores.E >= scores.I) ? 'E' : 'I';
  type += (scores.S >= scores.N) ? 'S' : 'N';
  type += (scores.T >= scores.F) ? 'T' : 'F';
  type += (scores.J >= scores.P) ? 'J' : 'P';

  var td = typeData[type];

  // Result card
  document.getElementById('resultEmoji').textContent = td.emoji;
  document.getElementById('resultType').textContent = type;
  document.getElementById('resultNickname').textContent = td.nick;
  document.getElementById('resultDesc').textContent = td.desc;

  // Letter cards
  var letters = type.split('');
  var letterHtml = '';
  for (var li = 0; li < letters.length; li++) {
    var L = letters[li];
    var lm = letterMeanings[L];
    letterHtml += '<div class="letter-card">' +
      '<div class="letter-badge" style="background:' + dimColors[L] + '">' + L + '</div>' +
      '<div class="letter-info">' +
        '<div class="letter-word">' + lm.word + '</div>' +
        '<div class="letter-trait">' + lm.trait + '</div>' +
      '</div>' +
    '</div>';
  }
  document.getElementById('letterCards').innerHTML = letterHtml;

  // Dimension bars
  var dimHtml = '<div class="dim-title">四维度倾向</div>';
  ['EI','SN','TF','JP'].forEach(function(d) {
    var p = dimPairs[d];
    var lv = scores[p.left] || 0;
    var rv = scores[p.right] || 0;
    var total = lv + rv;
    var leftPct = total > 0 ? (lv / total * 100) : 50;
    dimHtml += '<div class="dim-bar-row">' +
      '<div class="dim-label-left" style="color:' + p.leftColor + '">' + p.left + ' ' + p.leftLabel + ' ' + lv + '</div>' +
      '<div class="dim-bar-wrap"><div class="dim-bar-inner" style="width:' + leftPct + '%;background:' + p.leftColor + '"></div></div>' +
      '<div class="dim-label-right" style="color:' + p.rightColor + '">' + rv + ' ' + p.right + ' ' + p.rightLabel + '</div>' +
    '</div>';
  });
  document.getElementById('dimSection').innerHTML = dimHtml;

  showScreen('result');
}

// Init
window.addEventListener('DOMContentLoaded', function() {
  renderQuestion();
});
</script>
</body>
</html>
